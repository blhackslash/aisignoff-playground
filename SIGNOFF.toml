# AI declarations for this repository: generation (G0-G3), human review (H0-H3)
# and AI review (A0-A3).
# Scheme: https://github.com/industrial-mathematics-group/.github/blob/main/.github/CONTRIBUTING.md#ai-assisted-contributions
# The LAST annotation that matches a file wins. Inline tags in a file win over
# this file unless the matching annotation sets precedence = "override".
version = 3

# exclude = ["reviews/**", "docs/build/**"]   # files that need no declaration,
# such as the committed AI reviews in reviews/ (CONTRIBUTING.md)

# Line-level declarations: each line takes the declaration of the commit that landed it on main
# (the ticked PR template or "Key: value" lines in its merge or squash commit); the annotations
# below are the fallback for lines whose commit declares nothing.
[history]
enabled = true
merge-method = "merge"     # how PRs land: "merge" (default), "squash" or "rebase"
# undeclared = "error"     # uncomment to require a declaration from every commit that lands on main

# Minimum review levels. G1-G3 always need at least A1. Tick only H0 in a PR to see it fail.
[policy]
"*" = { human = "H1" }
G3  = { human = "H1", ai = "A2" }

# Default for everything
[[annotations]]
path = "**"
AI-Generation = "G0"
Human-Review = "H2"
AI-Review = "A0"
Reviewed-by = ["Pascal Jung"]

[[annotations]]
path = "src/playground/fitting.py"
AI-Generation = "G2"
Human-Review = "H1"
AI-Review = "A1"
Assisted-by = ["Claude Opus 5.5 (Anthropic)"]
Reviewed-by = ["Pascal Jung"]
AI-Reviewed-by = ["Claude Opus 5.5 (Anthropic), self-check by the generating session"]

[[annotations]]
path = "results/**"
AI-Generation = "G3"
Human-Review = "H1"
AI-Review = "A2"
Assisted-by = ["Claude Opus 5.5 (Anthropic)"]
Reviewed-by = ["Pascal Jung"]
AI-Reviewed-by = ["Claude Opus 5.5 (Anthropic), fresh review session"]
